        async function saveKeyAccountToCloud() {
            if (!db || !cloudUser) return;
            try {
                const kaRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloversoft_config', 'key_account');
                await setDoc(kaRef, state.keyAccount);
            } catch (err) {
                console.error("Cloud sync error (Key Account):", err);
                showToast("Warning: Could not sync Key Account changes to cloud.", "error");
            }
        }

        async function saveSellerToCloud(sellerObj) {
            if (!db || !cloudUser || !sellerObj) return;
            try {
                const docId = sellerObj.id || ('seller_' + sellerObj.loginName.toLowerCase().replace(/[^a-z0-9]/g, '_'));
                sellerObj.id = docId;
                const sellerRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloversoft_sellers', docId);
                await setDoc(sellerRef, {
                    id: docId,
                    loginName: sellerObj.loginName,
                    password: sellerObj.password,
                    companyName: sellerObj.companyName,
                    contactNumber: sellerObj.contactNumber,
                    deliveryAddress: sellerObj.deliveryAddress,
                    email: sellerObj.email,
                    stock: sellerObj.stock || createEmptyStockMap(),
                    orders: sellerObj.orders || []
                });
            } catch (err) {
                console.error("Cloud sync error (Seller):", err);
                showToast("Warning: Could not sync seller data to cloud.", "error");
            }
        }

        async function initCloudStorage() {
            if (!firebaseConfig) {
                updateCloudBadge("Local Session Mode", false);
                state.isCloudReady = true;
                render();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // RULE 3: Authenticate BEFORE any Firestore operations
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    cloudUser = cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    cloudUser = cred.user;
                }

                if (!cloudUser) return;

                // Seed initial Key Account & Demo Seller if cloud database is brand new
                const kaRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloversoft_config', 'key_account');
                const kaSnap = await getDoc(kaRef);
                if (!kaSnap.exists()) {
                    await setDoc(kaRef, DEFAULT_KEY_ACCOUNT);
                    const demoRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloversoft_sellers', DEFAULT_DEMO_SELLER.id);
                    await setDoc(demoRef, DEFAULT_DEMO_SELLER);
                }

                // Real-time listener for Key Account profile
                onSnapshot(kaRef, (snapshot) => {
                    if (snapshot.exists()) {
                        state.keyAccount = snapshot.data();
                        if (state.currentUser && state.currentUser.role === 'key') {
                            state.currentUser.loginName = state.keyAccount.loginName;
                        }
                        if (state.currentView === 'key-account') render();
                    }
                }, (error) => {
                    console.error("Key Account snapshot error:", error);
                });

                // Real-time listener for All Sellers (RULE 2: Simple collection query, sort in JS memory)
                const sellersCol = collection(db, 'artifacts', appId, 'public', 'data', 'cloversoft_sellers');
                onSnapshot(sellersCol, (querySnapshot) => {
                    const loadedSellers = [];
                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        data.id = docSnap.id;
                        if (!data.stock) data.stock = createEmptyStockMap();
                        if (!data.orders) data.orders = [];
                        loadedSellers.push(data);
                    });

                    // Sort alphabetically by loginName in memory
                    loadedSellers.sort((a, b) => a.loginName.localeCompare(b.loginName));
                    state.sellers = loadedSellers;
                    state.isCloudReady = true;
                    updateCloudBadge("Cloud Synced", true);

                    // Avoid overwriting active typing inputs on edit forms during background updates
                    const activeTag = document.activeElement ? document.activeElement.tagName : '';
                    if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
                        render();
                    }
                }, (error) => {
                    console.error("Sellers snapshot error:", error);
                    updateCloudBadge("Sync Interrupted", false);
                });

            } catch (err) {
                console.error("Cloud initialization failed:", err);
                updateCloudBadge("Offline Mode", false);
                state.isCloudReady = true;
                render();
            }
        }

        // ==========================================

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success' 
                ? 'bg-emerald-800 text-white border-emerald-600' 
                : type === 'error' 
                ? 'bg-red-700 text-white border-red-500' 
                : 'bg-slate-800 text-white border-slate-600';
            const icon = type === 'success' 
                ? 'fa-circle-check' 
                : type === 'error' 
                ? 'fa-circle-exclamation' 
                : 'fa-circle-info';

            toast.className = `${colors} border px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium pointer-events-auto transform transition-all duration-300 translate-y-0 opacity-100`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span class="flex-1">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Custom Modal for Password Verification
        let modalCallback = null;
        function openPasswordModal({ title, subtitle, expectedPassword, confirmBtnText = "Confirm", isDanger = false, onSuccess }) {
            const modal = document.getElementById('auth-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-subtitle').textContent = subtitle;
            const input = document.getElementById('modal-password-input');
            const err = document.getElementById('modal-error-msg');
            const btn = document.getElementById('modal-confirm-btn');

            input.value = '';
            err.classList.add('hidden');
            btn.textContent = confirmBtnText;
            btn.className = isDanger 
                ? 'px-5 py-2 rounded-xl text-sm font-semibold bg-red-600 hover:bg-red-700 text-white shadow-sm transition'
                : 'px-5 py-2 rounded-xl text-sm font-semibold bg-emerald-700 hover:bg-emerald-800 text-white shadow-sm transition';

            modalCallback = () => {
                if (input.value === expectedPassword) {
                    closeModal();
                    onSuccess();
                } else {
                    err.textContent = "Incorrect password. Please try again.";
                    err.classList.remove('hidden');
                }
            };

            btn.onclick = modalCallback;
            input.onkeydown = (e) => { if (e.key === 'Enter') modalCallback(); };

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => input.focus(), 50);
        }

        function closeModal() {
            const modal = document.getElementById('auth-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modalCallback = null;
        }

        function navigate(view, params = {}) {
            if (params.sellerLoginName !== undefined) state.selectedSellerLoginName = params.sellerLoginName;
            if (params.orderId !== undefined) state.selectedOrderId = params.orderId;
            state.searchQuery = "";
            state.currentView = view;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function logout() {
            state.currentUser = null;
            state.selectedSellerLoginName = null;
            state.selectedOrderId = null;
            refreshCaptcha();
            navigate('login');
            showToast("Logged out safely.", "info");

            state.captchaNum1 = Math.floor(Math.random() * 9) + 1;

            if (!state.currentUser || state.currentUser.role !== 'seller') return null;
            return state.sellers.find(s => s.loginName === state.currentUser.loginName);
        }

            return state.sellers.find(s => s.loginName === state.selectedSellerLoginName);

        function verifyIdentityForReset() {
            const loginName = document.getElementById('reset-login').value.trim();
            const email = document.getElementById('reset-email').value.trim();

            if (loginName === state.keyAccount.loginName && email.toLowerCase() === state.keyAccount.email.toLowerCase()) {
                state.resetFlow.verifiedUser = { type: 'key', loginName: state.keyAccount.loginName, email: state.keyAccount.email };
                state.resetFlow.codeSent = true;
                render();
                return;
            }

            const seller = state.sellers.find(s => s.loginName === loginName && s.email.toLowerCase() === email.toLowerCase());
            if (seller) {
                state.resetFlow.verifiedUser = { type: 'seller', loginName: seller.loginName, email: seller.email };
                state.resetFlow.codeSent = true;
                render();
                return;
            }

            showToast("Log-in Name and Email Address do not match any account.", "error");
        }

        function sendSixDigitCode() {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            state.resetFlow.generatedCode = code;
            showToast(`6-digit verification code sent to ${state.resetFlow.verifiedUser.email}!`);
            render();
        }

        function checkSixDigitCode() {
            const entered = document.getElementById('reset-code').value.trim();
            if (entered === state.resetFlow.generatedCode) {
                state.resetFlow.codeVerified = true;
                showToast("Verification code confirmed!");
                render();
            } else {

        async function completePasswordReset() {
            const p1 = document.getElementById('reset-new-pass').value;
            const p2 = document.getElementById('reset-confirm-pass').value;
            if (!p1 || p1 !== p2) {
                showToast("New Password and Confirm New Password must match and not be empty.", "error");
                return;
            }

            const target = state.resetFlow.verifiedUser;
            if (target.type === 'key') {
                state.keyAccount.password = p1;
                await saveKeyAccountToCloud();
            } else {
                const seller = state.sellers.find(s => s.loginName === target.loginName);
                if (seller) {
                    seller.password = p1;
                    await saveSellerToCloud(seller);
                }
            }

            showToast("Password successfully updated in cloud! Please log in.");
            refreshCaptcha();
            navigate('login');
        }

        function recalcOrderRow(inputEl) {
            const no = inputEl.getAttribute('data-order-no');
            const upc = parseInt(inputEl.getAttribute('data-upc'), 10);
            const cartons = Math.max(0, parseInt(inputEl.value, 10) || 0);
            const units = cartons * upc;
            document.getElementById(`order-unit-total-${no}`).textContent = units.toLocaleString();

            // Update summary totals
            let totalCartons = 0;
            let totalUnits = 0;
            document.querySelectorAll('.order-carton-input').forEach(inp => {
                const c = Math.max(0, parseInt(inp.value, 10) || 0);
                const u = parseInt(inp.getAttribute('data-upc'), 10);
                totalCartons += c;
                totalUnits += (c * u);
            });
            document.getElementById('summary-cartons').textContent = totalCartons.toLocaleString();
            document.getElementById('summary-units').textContent = totalUnits.toLocaleString();
        }

        function initiateOrderSubmit() {
            const dateVal = document.getElementById('new-order-date').value;
            if (!dateVal) {
                showToast("Please key in the Order Date before submitting.", "error");
                return;
            }

            const items = {};
            let totalCartons = 0;
            document.querySelectorAll('.order-carton-input').forEach(inp => {
                const no = parseInt(inp.getAttribute('data-order-no'), 10);
                const cartons = Math.max(0, parseInt(inp.value, 10) || 0);
                if (cartons > 0) {
                    items[no] = cartons;
                    totalCartons += cartons;
                }
            });

            if (totalCartons === 0) {
                showToast("Please enter at least 1 carton for a product to place an order.", "error");
                return;
            }

            const seller = getLoggedSeller();
            openPasswordModal({
                title: "Confirm Order Submission",
                subtitle: `Enter your account password (${seller.loginName}) to submit order for ${dateVal} and email ${state.keyAccount.email}.`,
                expectedPassword: seller.password,
                confirmBtnText: "Submit & Send Email",
                onSuccess: async () => {
                    const orderId = `ORD-${Date.now().toString().slice(-6)}`;
                    seller.orders.unshift({
                        id: orderId,
                        date: dateVal,
                        items: items
                    });

                    await saveSellerToCloud(seller);

                    // Build formatted email body and open mail client / show dispatch notice
                    let tableText = `New Order from ${seller.companyName} (${seller.loginName})\nDate: ${dateVal}\nDelivery Address: ${seller.deliveryAddress}\n\nNo. | Product Name | SKU | Cartons | Units\n--------------------------------------------------\n`;
                    PRODUCTS.forEach(p => {
                        if (items[p.no]) {
                            tableText += `${p.no} | ${p.name} | ${p.sku} | ${items[p.no]} ctns | ${items[p.no] * p.upc} units\n`;
                        }
                    });

                    // Trigger mailto link silently in background if supported, plus UI toast
                    const mailtoUrl = `mailto:${encodeURIComponent(state.keyAccount.email)}?subject=${encodeURIComponent(`Cloversoft New Order - ${seller.loginName} (${dateVal})`)}&body=${encodeURIComponent(tableText)}`;
                    const link = document.createElement('a');
                    link.href = mailtoUrl;
                    link.click();

                    showToast(`Order submitted & saved to cloud! Table emailed to ${state.keyAccount.email}.`);
                    navigate('seller-pass-orders');
                }
            });
        }

        function exportOverallCSV() {
            const headers = ["No.", "Products Name", "SKU code", ...state.sellers.map(s => s.loginName), "Total"];
            const rows = PRODUCTS.map(p => {
                let sum = 0;
                const sellerVals = state.sellers.map(s => {
                    const v = s.stock[p.no] ?? 0;
                    sum += v;
                    return v;
                });
                return [p.no, `"${p.name}"`, p.sku, ...sellerVals, sum].join(",");
            });
            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Cloversoft_Overall_Seller_Stock_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
            showToast("Overall Seller Stock CSV downloaded!");
        }

            const newCompany = document.getElementById('ka-edit-sel-company').value.trim();

        function recalcKeyOrderRow(inp) {
            const no = inp.getAttribute('data-ka-ord-no');
            const upc = parseInt(inp.getAttribute('data-upc'), 10);
            const c = Math.max(0, parseInt(inp.value, 10) || 0);
            document.getElementById(`ka-ord-units-${no}`).textContent = (c * upc).toLocaleString();
        }
        async function saveKeyPassOrderEdits() {
            const seller = getSelectedSellerForKey();
            const activeOrder = seller.orders.find(o => o.id === state.selectedOrderId);
            if (!activeOrder) return;

            const updatedItems = {};
            document.querySelectorAll('.ka-order-cell').forEach(inp => {
                const no = parseInt(inp.getAttribute('data-ka-ord-no'), 10);
                const c = Math.max(0, parseInt(inp.value, 10) || 0);
                if (c > 0) updatedItems[no] = c;
            });

            activeOrder.items = updatedItems;
            await saveSellerToCloud(seller);
            showToast(`Pass Order (${activeOrder.date}) updated in cloud and synced to ${seller.loginName}!`);
            render();
        }

        // 3.3 Account Page - Key Account
        function renderKeyAccountPage() {
            const ka = state.keyAccount;
            return `
                ${renderKeyAccountNavbar('key-account')}
                <main class="max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-900 px-6 py-4 text-white">
                            <h2 class="text-lg font-bold">Account Page - Key Account</h2>
                            <p class="text-slate-300 text-xs">Master Administrator Profile (All fields can be edited with password verification)</p>
                        </div>

                        <div class="p-6 space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Key Account Log-in Name</label>
                                    <input type="text" id="ka-own-login" value="${ka.loginName}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Company Name</label>
                                    <input type="text" id="ka-own-company" value="${ka.companyName}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Contact Number</label>
                                    <input type="text" id="ka-own-contact" value="${ka.contactNumber}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Email Address (Receives Seller Orders)</label>
                                    <input type="email" id="ka-own-email" value="${ka.email}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm">
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Delivery Address</label>
                                    <textarea id="ka-own-address" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm">${ka.deliveryAddress}</textarea>
                                </div>
                            </div>

                            <div class="flex justify-end pt-2">
                                <button onclick="saveKeyAccountOwnInfo()" class="px-6 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm shadow transition flex items-center gap-2">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit &amp; Save Key Account Info
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Change Key Account Password -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-800 px-6 py-4 text-white">
                            <h2 class="text-base font-bold">Change Key Account Password</h2>
                            <p class="text-slate-300 text-xs">Key in your old password to set a new password</p>
                        </div>
                        <div class="p-6 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Old Password</label>
                                <input type="password" id="ka-old-pass" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm" placeholder="Current password">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">New Password</label>
                                <input type="password" id="ka-new-pass" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-600 outline-none text-sm" placeholder="New password">
                            </div>
                            <div>
                                <button onclick="changeKeyAccountPassword()" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-950 text-white font-semibold text-sm shadow transition">
                                    Update Password
                                </button>
                            </div>
                        </div>
                    </div>
                </main>
            `;
        }

        function saveKeyAccountOwnInfo() {
            const loginName = document.getElementById('ka-own-login').value.trim();
            const companyName = document.getElementById('ka-own-company').value.trim();
            const contactNumber = document.getElementById('ka-own-contact').value.trim();
            const email = document.getElementById('ka-own-email').value.trim();
            const deliveryAddress = document.getElementById('ka-own-address').value.trim();

            if (!loginName || !companyName || !contactNumber || !email || !deliveryAddress) {
                showToast("All fields must be filled in.", "error");
                return;
            }

            openPasswordModal({
                title: "Verify Key Account Password",
                subtitle: "Please key in your original password to proceed with updating Key Account information.",
                expectedPassword: state.keyAccount.password,
                confirmBtnText: "Save Changes",
                onSuccess: async () => {
                    state.keyAccount.loginName = loginName;
                    state.keyAccount.companyName = companyName;
                    state.keyAccount.contactNumber = contactNumber;
                    state.keyAccount.email = email;
                    state.keyAccount.deliveryAddress = deliveryAddress;
                    state.currentUser.loginName = loginName;
                    await saveKeyAccountToCloud();
                    showToast("Key Account information updated in cloud!");
                    render();
                }
            });
        }

        async function changeKeyAccountPassword() {
            const oldP = document.getElementById('ka-old-pass').value;
            const newP = document.getElementById('ka-new-pass').value;

            if (oldP !== state.keyAccount.password) {
                showToast("Old password is incorrect.", "error");
                return;
            }
            if (!newP || newP.length < 4) {
                showToast("Please enter a valid new password.", "error");
                return;
            }

            state.keyAccount.password = newP;
            await saveKeyAccountToCloud();
            document.getElementById('ka-old-pass').value = '';
            document.getElementById('ka-new-pass').value = '';
            showToast("Key Account password updated in cloud!");
        }

        // ==========================================
        // 8. MAIN RENDER ROUTER & GLOBAL EXPORTS
        // ==========================================
        function render() {
            const app = document.getElementById('app');
            switch (state.currentView) {
                case 'login':
                    app.innerHTML = renderLoginPage();
                    attachLoginHandlers();
                    break;
                case 'create-account':
                    app.innerHTML = renderCreateAccountPage();
                    attachCreateAccountHandlers();
                    break;
                case 'reset-password':
                    app.innerHTML = renderResetPasswordPage();
                    break;
                case 'seller-stock':
                    app.innerHTML = renderSellerStockPage();
                    break;
                case 'seller-new-order':
                    app.innerHTML = renderSellerNewOrderPage();
                    break;
                case 'seller-pass-orders':
                    app.innerHTML = renderSellerPassOrdersPage();
                    break;
                case 'seller-pass-order-detail':
                    app.innerHTML = renderSellerPassOrderDetailPage();
                    break;
                case 'seller-account':
                    app.innerHTML = renderSellerAccountPage();
                    break;
                case 'key-seller-list':
                    app.innerHTML = renderKeySellerListPage();
                    break;
                case 'key-overall':
                    app.innerHTML = renderKeyOverallPage();
                    break;
                case 'key-account':
                    app.innerHTML = renderKeyAccountPage();
                    break;
                case 'key-seller-main':
                    app.innerHTML = renderKeySellerMainPage();
                    break;
                case 'key-seller-info':
                    app.innerHTML = renderKeySellerInfoPage();
                    break;
                case 'key-pass-order-mgmt':
                    app.innerHTML = renderKeyPassOrderMgmtPage();
                    break;
                default:
                    app.innerHTML = renderLoginPage();
                    attachLoginHandlers();
            }
        }

        // Expose functions globally for inline HTML event handlers (required for type="module")
        Object.assign(window, {
            navigate,
            logout,
            refreshCaptcha,
            closeModal,
            startResetFlow,
            verifyIdentityForReset,
            sendSixDigitCode,
            checkSixDigitCode,
            completePasswordReset,
            saveSellerStock,
            recalcOrderRow,
            initiateOrderSubmit,
            saveSellerProfileInfo,
            changeSellerPassword,
            exportOverallCSV,
            keySaveSellerInfo,
            keyRemoveSellerAccount,
            recalcKeyOrderRow,
            saveKeyPassOrderEdits,
            saveKeyAccountOwnInfo,
            changeKeyAccountPassword,
            render,
            state
        });

        // Initialize on load (Always starts on Log-in page & connects to cloud storage)
        window.onload = () => {
            render();
            initCloudStorage();
        };
    </script>
</body>
</html>
